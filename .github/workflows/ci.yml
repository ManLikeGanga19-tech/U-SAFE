name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: # manual deploy from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: frontends typecheck + production build ───────
  frontend:
    name: Frontend (web + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck + build
        run: pnpm turbo run typecheck build
        env:
          NEXT_PUBLIC_API_URL: https://api.placeholder.dev

  # ── Gate 2: API imports + Docker image builds ────────────
  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usafe
          POSTGRES_PASSWORD: usafe_test_pw
          POSTGRES_DB: usafe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usafe -d usafe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Import check (app boots)
        run: python -c "import app.main; import app.models; print('api imports ok')"
      - name: Tests (orders, payments, stock, uploads)
        run: pytest -q
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: usafe
          POSTGRES_PASSWORD: usafe_test_pw
          POSTGRES_DB: usafe_test
      - name: Docker build
        run: docker build -t usafe-api:ci .

  # ── Deploy to the VPS (production) ───────────────────────
  # Runs only on push to main (or a manual dispatch). Ships the backend to the
  # Contabo VPS over SSH: rsync the code into ~/usafe, then rebuild the stack.
  # Secrets required (repo → Settings → Secrets and variables → Actions):
  #   VPS_SSH_KEY   private key whose public half is in deploy@'s authorized_keys
  #   VPS_HOST      94.72.102.13
  #   VPS_SSH_PORT  22 (optional; defaults to 22)
  deploy:
    name: Deploy to VPS
    needs: [frontend, api]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          [ -z "$VPS_SSH_KEY" ] && { echo "::error::VPS_SSH_KEY not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        # -R keeps relative paths, so services/api lands in ~/usafe/services/api
        # (where docker-compose.prod.yml builds from). Without it rsync put the
        # code in ~/usafe/api and every deploy silently rebuilt the OLD code.
        run: |
          rsync -azR --delete \
            --exclude '__pycache__' --exclude '*.pyc' --exclude '.venv' \
            --exclude '.pytest_cache' --exclude '.ruff_cache' --exclude '.mypy_cache' \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            ./services/api ./infra \
            "deploy@$VPS_HOST:~/usafe/"

      - name: Build + restart the stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          SHA: ${{ github.sha }}
        run: |
          SHORT=$(echo "$SHA" | cut -c1-7)
          ssh -i ~/.ssh/id_deploy -p "$PORT" "deploy@$VPS_HOST" \
            "docker network inspect usafe-edge-net >/dev/null 2>&1 || docker network create usafe-edge-net; \
             cd ~/usafe && GIT_COMMIT=$SHORT docker compose -f infra/docker-compose.prod.yml up -d --build"

      - name: Smoke test (API reports the new commit)
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Waiting for api.u-safe.co.ke to report $SHORT"
          for i in $(seq 1 40); do
            body=$(curl -fsS --max-time 10 https://api.u-safe.co.ke/api/v1/health 2>/dev/null || echo '{}')
            status=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo '')
            ver=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo '')
            echo "  [$i/40] status=$status version=$ver"
            if [ "$status" = "ok" ] && [ "$ver" = "$SHORT" ]; then echo "VPS healthy on new version."; exit 0; fi
            sleep 10
          done
          echo "::error::VPS did not report healthy on $SHORT in time"; exit 1
